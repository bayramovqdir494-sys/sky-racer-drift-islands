<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Sky Racer: Drift Islands</title>
<link rel="stylesheet" href="css/style.css"/>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="loader"><div class="logo"><b>SKY RACER</b><s>DRIFT ISLANDS</s></div><div class="bar"><i id="loadbar"></i></div><div class="dim" id="loadtxt">Loading</div></div>
<div id="ui">
  <div id="home" class="scr">
    <div class="wallet" id="wallet">COINS <b>0</b></div>
    <div class="corner">
      <button class="ibtn hit" id="btnAudio" title="Audio">♪</button>
      <button class="ibtn hit" id="btnDaily" title="Daily">☀</button>
    </div>
    <div class="brand"><b>SKY RACER</b><s>DRIFT ISLANDS</s></div>
    <div class="mid">
      <div class="sel" id="homeSel">GREEN ISLES  •  SKY HATCH</div>
      <button class="btn big hit" id="btnRace">RACE</button>
      <div class="row">
        <button class="btn sec hit" id="btnTracks">TRACKS</button>
        <button class="btn sec hit" id="btnGarage">GARAGE</button>
        <button class="btn cy hit" id="btnDaily2">DAILY</button>
      </div>
    </div>
  </div>

  <div id="sheetTracks" class="sheet"><div class="panel">
    <div class="top"><h2>Tracks</h2><button class="btn sec" data-close="sheetTracks">Back</button></div>
    <div class="grid" id="trackGrid"></div>
  </div></div>

  <div id="sheetGarage" class="sheet"><div class="panel">
    <div class="top"><h2>Garage</h2><button class="btn sec" data-close="sheetGarage">Back</button></div>
    <div class="grid" id="carGrid"></div>
    <div class="row" id="upgradeRow"></div>
    <div class="row" id="colorRow"></div>
  </div></div>

  <div id="sheetDaily" class="sheet"><div class="panel">
    <div class="top"><h2>Daily</h2><button class="btn sec" data-close="sheetDaily">Back</button></div>
    <div class="dim" id="streakLbl">Streak 0</div>
    <div class="daygrid" id="dayGrid"></div>
    <button class="btn" id="btnClaim">Claim today's gift</button>
    <h2 style="font-size:20px;margin-top:8px">Challenge</h2>
    <div id="challengeBox" class="mis"></div>
    <h2 style="font-size:20px">Missions</h2>
    <div id="missionList" style="display:flex;flex-direction:column;gap:8px;overflow:auto"></div>
  </div></div>

  <div id="hud" class="scr">
    <div class="topbar">
      <div class="pill" id="posPill"><b>P1</b><s>POSITION</s></div>
      <div class="pill" id="lapPill"><b>1/3</b><s>LAP</s></div>
      <div class="pill" id="timePill"><b>0:00.0</b><s>TIME</s></div>
    </div>
    <div id="nitroWrap"><s>NITRO</s><div id="nitroBar"><i id="nitroFill"></i></div></div>
    <canvas id="mini" width="160" height="160"></canvas>
    <div id="speedo"><b id="spd">0</b><s>KM/H</s></div>
    <button class="ibtn" id="pauseBtn">❚❚</button>
    <div id="modeTag"></div>
    <div id="wrongWay">WRONG WAY</div>
    <div id="hint"></div>
    <div id="cd"></div>
    <div id="toast"></div>
    <div id="pads">
      <div class="pad" id="padL">
        <button class="tbtn" id="btnL">◀</button>
        <button class="tbtn" id="btnR">▶</button>
      </div>
      <div class="pad" id="padR">
        <button class="tbtn" id="btnNitro">NITRO</button>
        <button class="tbtn" id="btnDrift">DRIFT</button>
        <button class="tbtn" id="btnBrake">BRAKE</button>
        <button class="tbtn" id="btnGas">GAS</button>
      </div>
    </div>
    <div id="dbg"></div>
  </div>

  <div id="pause" class="sheet"><div class="panel" style="width:min(420px,92vw);text-align:center;align-items:center">
    <h2>Paused</h2>
    <div class="row"><button class="btn" id="btnResume">RESUME</button></div>
    <div class="row"><button class="btn sec" id="btnQuit">QUIT TO MENU</button></div>
  </div></div>

  <div id="result" class="sheet"><div class="panel" style="width:min(520px,94vw);align-items:center">
    <div class="place" id="rPlace">P1</div>
    <div class="stars" id="rStars">★★★</div>
    <div id="rTime" class="sel">0:00.0</div>
    <div id="rCoins" class="sel">+0 coins</div>
    <div class="row" style="margin-top:8px">
      <button class="btn cy" id="btnDouble">DOUBLE COINS</button>
    </div>
    <div class="row">
      <button class="btn" id="btnRetry">RACE AGAIN</button>
      <button class="btn sec" id="btnToMenu">MENU</button>
    </div>
  </div></div>
</div>
<div id="rotateOverlay" aria-live="polite" aria-hidden="true">
  <div class="rotate-phone" aria-hidden="true"></div>
  <div class="rotate-title">Telefonu çevirin</div>
  <div class="rotate-sub">Rotate your device</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
